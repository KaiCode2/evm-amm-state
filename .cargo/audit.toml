# cargo-audit policy for evm-amm-state.
#
# Run `cargo audit` from the crate root; this ignore-list documents advisories
# that are present in Cargo.lock but provably outside every build graph.

[advisories]
ignore = [
    # tracing-subscriber 0.2.25 (ANSI-escape log poisoning) enters Cargo.lock
    # only below ark-bn254's optional r1cs support
    # (ark-bn254 -> ark-r1cs-std -> ark-relations -> tracing-subscriber).
    # No feature of this crate (or of its enabled dependency features) turns
    # that proof-system support on: `cargo tree -i
    # tracing-subscriber@0.2.25 --target all --all-features` resolves to
    # nothing, so the crate is never compiled, linked, or shipped. Remove this
    # entry when upstream arkworks drops or upgrades the inactive dependency.
    "RUSTSEC-2025-0055",
]
