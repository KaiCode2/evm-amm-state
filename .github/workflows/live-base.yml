name: Stage 10 Base live gates

on:
  workflow_dispatch:

env:
  TRANSPORT_REF: 7868bea593dec5748ad7475d1909fc3a2de0d4ad
  CACHE_REF: 2be88d15fa15b5c44188b318463aa4705bb75aef

permissions:
  contents: read

defaults:
  run:
    working-directory: evm-amm-state

jobs:
  base-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: evm-amm-state
      - name: Check out exact cache candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KaiCode2/evm-fork-cache
          ref: ${{ env.CACHE_REF }}
          path: evm-fork-cache
      - name: Check out exact transport candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KaiCode2/alloy-transport-balancer
          ref: ${{ env.TRANSPORT_REF }}
          path: alloy-transport-balancer

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: evm-amm-state -> target

      - name: Solidly and Slipstream parity
        env:
          E2E_BASE_RPC_URL: ${{ secrets.E2E_BASE_RPC_URL }}
        run: ./scripts/stage10-base-live-gates.sh
