name: Stage 10 live gates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: stage10-live
  cancel-in-progress: false

env:
  TRANSPORT_REF: b84a24823286313cf6ab19e2da4b38724e925dba
  CACHE_REF: e51aaf2e17275c73af0809073c5bcba8ddf23805
  SEARCH_REF: 2a1bdacb8e91143278570d01d3a06ccfa59acef2

permissions:
  contents: read

defaults:
  run:
    working-directory: evm-amm-state

jobs:
  paid-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: evm-amm-state
      - name: Check out exact search candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KaiCode2/evm-amm-search
          ref: ${{ env.SEARCH_REF }}
          path: evm-amm-search
      - name: Check out exact cache candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KaiCode2/evm-fork-cache
          ref: ${{ env.CACHE_REF }}
          path: evm-fork-cache
      - name: Check out exact transport candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KaiCode2/alloy-transport-balancer
          ref: ${{ env.TRANSPORT_REF }}
          path: alloy-transport-balancer

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            evm-amm-state -> target
            evm-amm-search -> target

      - name: Mainnet parity, WS health, and progressive route bootstrap
        env:
          E2E_RPC_URL: ${{ secrets.E2E_RPC_URL }}
          ETH_WS_URL: ${{ secrets.ETH_WS_URL }}
        run: ./scripts/stage10-live-gates.sh
