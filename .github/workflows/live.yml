name: Stage 10 live gates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: stage10-live
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: evm-amm-state

jobs:
  paid-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: evm-amm-state
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            evm-amm-state -> target

      - name: Install the released search TUI
        run: cargo install evm-amm-search --version '=0.2.0' --locked --features live-runtime --bin amm-route-tui

      - name: Mainnet parity, WS health, and progressive route bootstrap
        env:
          E2E_RPC_URL: ${{ secrets.E2E_RPC_URL }}
          ETH_WS_URL: ${{ secrets.ETH_WS_URL }}
        run: AMM_ROUTE_TUI_BIN="$(command -v amm-route-tui)" ./scripts/stage10-live-gates.sh
