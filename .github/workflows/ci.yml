name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

defaults:
  run:
    working-directory: evm-amm-state

jobs:
  check:
    name: test / clippy / fmt / docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: evm-amm-state
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: evm-amm-state -> target

      - name: Authoring hygiene
        run: bash scripts/check-authoring-hygiene.sh

      - name: Formatting
        run: cargo fmt --all --check

      - name: Diff hygiene
        run: git diff --check

      # Lint the whole surface together: every protocol adapter (including the
      # PancakeSwap V3 and Slipstream family flags, which are not in `default`).
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features --no-deps -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --locked --no-default-features --all-targets --no-deps -- -D warnings

      - name: Verify build is heavy-dep-free
        run: |
          if cargo tree --locked -e normal --all-features \
              | grep -E '(amms|amm-math|rayon) v[0-9]'; then
            echo "::error::build unexpectedly pulled amms/amm-math/rayon"
            exit 1
          fi
          echo "build pulls no amms/amm-math/rayon"

      - name: Tests (all features)
        run: cargo test --locked --all-features

      - name: Tests (default features)
        run: cargo test --locked

      - name: Tests (no default features)
        run: cargo test --locked --no-default-features

      - name: Check (live runtime only)
        run: cargo check --locked --all-targets --no-default-features --features live-runtime

      - name: Docs
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Check (experimental protocols)
        run: cargo check --locked --features experimental-protocols
      - name: Check (experimental protocols, no default features)
        run: cargo check --locked --no-default-features --features experimental-protocols

      - name: Benchmarks compile
        run: cargo bench --locked --no-run --all-features

      - name: Package
        run: cargo package --locked

      - name: Verify security-exception scope
        run: bash scripts/check-security-exceptions.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Security audit
        run: cargo audit --ignore RUSTSEC-2025-0055

  # Build each protocol independently so a combined all-feature build cannot
  # hide incorrect cfg-gating.
  isolation:
    name: clippy (isolated · ${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - uniswap-v2
          - uniswap-v3
          - pancake-v3
          - slipstream
          - balancer-v2
          - solidly-v2
          - curve
    steps:
      - name: Check out state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: evm-amm-state
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: evm-amm-state -> target

      - name: Clippy (adapters + ${{ matrix.feature }} only)
        run: cargo clippy --locked --no-default-features --features adapters,${{ matrix.feature }} --all-targets --no-deps -- -D warnings

  msrv:
    name: msrv (1.90)
    runs-on: ubuntu-latest
    steps:
      - name: Check out state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: evm-amm-state
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.90.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: evm-amm-state -> target

      - name: Check on MSRV
        run: cargo check --locked --all-features
